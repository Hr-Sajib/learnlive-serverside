name: CI

# Runs before Render deploys anything. Render's own build only runs `tsc`,
# which catches type errors but never executes the attendance engine's test
# suite — a change could type-check cleanly and still break the 60% rule.
# This is the gate that actually runs `vitest`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
